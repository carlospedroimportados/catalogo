<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CP Painel</title>
<meta name="theme-color" content="#0A1A2B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CP Painel">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
html,body{margin:0;height:100%;background:#0A1A2B;font:16px system-ui,-apple-system,sans-serif;color:#fff}
#app{position:fixed;inset:0;padding-top:env(safe-area-inset-top);background:#F4F6F9}
#app iframe{width:100%;height:100%;border:0;display:block}
#login{min-height:100%;display:grid;place-items:center;padding:24px;box-sizing:border-box}
#login form{width:min(360px,100%);display:grid;gap:14px;text-align:center}
#login img{width:96px;height:96px;border-radius:22px;margin:auto}
#login h1{margin:0;font-size:22px;color:#F3E2AD;letter-spacing:.06em}
#login p{margin:0;color:#94A3B8;font-size:14px}
#login input{height:52px;border-radius:14px;border:1px solid #2A3A4E;background:#12263B;color:#fff;font:inherit;padding:0 16px;text-align:center}
#login button{height:52px;border:0;border-radius:999px;font:inherit;font-weight:700;color:#0A1A2B;background:linear-gradient(135deg,#F3E2AD,#D6B26A 45%,#B8893B)}
#err{color:#F5A38B;font-size:14px;min-height:18px}
#sair{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:5;border:0;border-radius:999px;padding:8px 12px;font-size:12px;background:rgba(10,26,43,.7);color:#fff}
[hidden]{display:none!important}
</style></head><body>
<div id="login"><form id="f">
<img src="icon-192.png" alt="">
<h1>CP IMPORTS</h1><p>Painel administrativo</p>
<input id="pw" type="password" placeholder="Senha do painel" autocomplete="current-password" required>
<button type="submit">Entrar</button><div id="err"></div>
<p style="font-size:12px">A senha fica salva só neste celular.</p>
</form></div>
<div id="app" hidden></div>
<button id="sair" hidden type="button">Sair</button>
<script>
var URL_PAINEL='https://script.google.com/macros/s/AKfycbw1h3q90999q70J7BlFx_kDTcjGY7luxLWdN0o6lFqo3Vy90J-xTzqSyeeD6_H8sABS/exec?painel&k=';
function get(){try{return localStorage.getItem('cpk')||''}catch(e){return''}}
function set(v){try{v?localStorage.setItem('cpk',v):localStorage.removeItem('cpk')}catch(e){}}
function abrir(k){document.getElementById('login').hidden=true;var a=document.getElementById('app');a.hidden=false;
 a.innerHTML='<iframe src="'+URL_PAINEL+encodeURIComponent(k)+'" allow="clipboard-write" title="Painel"></iframe>';document.getElementById('sair').hidden=false}
document.getElementById('f').onsubmit=function(e){e.preventDefault();var k=document.getElementById('pw').value.trim();if(!k)return;set(k);abrir(k)};
document.getElementById('sair').onclick=function(){set('');location.reload()};
var k=get();if(k)abrir(k);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
</script></body></html>
